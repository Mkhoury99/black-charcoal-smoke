<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0a0a0c; color: #e8e8ea; font-family: system-ui, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; }
h1 { font-size: 28px; letter-spacing: .04em; }
input, select { display: block; width: 100%; max-width: 100%; height: 44px; margin: 6px 0 14px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: #111215; color: #fff; line-height: 44px; }
input[type=file] { height: auto; padding: 10px 12px; line-height: 1.4; }
button { min-height: 40px; border: 0; border-radius: 8px; background: #39ff5c; color: #06140a; font-weight: 700; padding: 0 14px; cursor: pointer; }
button.ghost { background: transparent; color: #e8e8ea; border: 1px solid rgba(255,255,255,.2); }
button:disabled { opacity: .55; cursor: wait; }
label.check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
label.check input { width: auto; height: auto; min-height: 0; margin: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.meta { color: #9a9aa3; font-size: 13px; }
.box { max-width: 420px; margin: 12vh auto; background: #14151a; border: 1px solid rgba(57,255,92,.4); border-radius: 16px; padding: 28px 24px; }
.editor { display: none; margin-top: 18px; background: #14151a; border-radius: 16px; padding: 22px 20px; }
.editor.on { display: block; }
.hidden { display: none; }
.err { color: #ffb4c8; }
.banner { margin: 0 0 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #14151a; font-size: 14px; line-height: 1.45; }
.banner.ok { border-color: rgba(57,255,92,.35); }
.banner.warn { border-color: rgba(227,179,65,.45); color: #f0e6c8; }
.banner code { font-size: 12px; color: #9ad0ff; }
</style>
<script src="../data/backend-config.js"></script>
<script src="../data/catalog-api.js"></script>
</head>
<body>
<div id="login" class="box">
  <h1>ADMIN</h1>
  <input id="user" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="enter">Sign in</button>
  <p id="err" class="err"></p>
</div>
<div id="app" class="wrap hidden">
  <h1>SHOP ITEMS</h1>
  <div id="modeBanner" class="banner"></div>
  <p><button id="add">Add item</button></p>
  <div id="addSlot"></div>
  <div id="list"></div>
  <form id="editor" class="editor">
    <h2 id="title">Edit item</h2>
    <label>Name</label><input id="name" required>
    <label>Type</label><select id="cat"></select>
    <label>Price</label><input id="price" type="number" min="0" step="0.01" required>
    <label class="check"><input id="visible" type="checkbox"> Show on the shop page</label>
    <label class="check"><input id="soldOut" type="checkbox"> Sold out</label>
    <label class="check"><input id="featured" type="checkbox"> Featured on the home page</label>
    <label class="check"><input id="delivery" type="checkbox"> Available for delivery</label>
    <label>Photo</label>
    <input id="photo" type="file" accept="image/*">
    <img id="preview" alt="" style="display:none;width:120px;height:120px;object-fit:cover;border-radius:10px;margin:0 0 12px">
    <p><button type="button" class="ghost" id="clearPhoto">Remove photo</button></p>
    <p>
      <button type="submit" id="saveBtn">Save</button>
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button type="button" class="ghost" id="remove">Delete</button>
    </p>
  </form>
  <p id="status" class="meta"></p>
</div>
<script>
const USER = "admin";
const PASS = "charcoal123";
let catalog = null;
let editing = null;
let photoData = "";
let source = "file";
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setBusy(busy) {
  $("saveBtn").disabled = busy;
  $("remove").disabled = busy;
  $("add").disabled = busy;
}

function updateBanner() {
  const el = $("modeBanner");
  if (BCSCatalog.cloudEnabled()) {
    el.className = "banner ok";
    el.innerHTML = source === "cloud"
      ? "Online mode: edits save to Firebase and show on every device after refresh."
      : "Online mode is configured, but the cloud catalog is empty. Save any item once to upload it. Database: <code>" + esc(BCSCatalog.dbRoot()) + "</code>";
  } else {
    el.className = "banner warn";
    el.innerHTML = "Local-only mode: edits stay in this browser. To sync online for free, open <code>data/backend-config.js</code>, paste your Firebase Realtime Database URL, push to GitHub, then reload this page.";
  }
}

$("enter").onclick = () => {
  if ($("user").value.trim() !== USER || $("pass").value !== PASS) {
    $("err").textContent = "Wrong username or password.";
    return;
  }
  sessionStorage.setItem("bcs-admin", "1");
  start();
};
if (sessionStorage.getItem("bcs-admin") === "1") start();

async function start() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("status").textContent = "Loading…";
  try {
    const result = await BCSCatalog.loadForAdmin();
    catalog = result.catalog;
    source = result.source;
    $("status").textContent = "";
    updateBanner();
    draw();
  } catch (e) {
    $("status").textContent = "Could not load catalog.";
    $("status").className = "err";
  }
}
function catName(id) {
  const c = catalog.categories.find(x => x.id === id);
  return c ? c.name : id;
}
function parkEditor() {
  $("editor").classList.remove("on");
  $("app").appendChild($("editor"));
}
function draw() {
  parkEditor();
  $("cat").innerHTML = catalog.categories.map(c => '<option value="' + c.id + '">' + esc(c.name) + "</option>").join("");
  $("list").innerHTML = catalog.products.map(p =>
    '<div class="block" data-id="' + p.id + '"><div class="item"><div><strong>' + esc(p.name) + '</strong><div class="meta">' + esc(catName(p.cat)) + " · $" + Number(p.price).toFixed(2) +
    (p.visible === false ? " · hidden" : "") + (p.soldOut ? " · sold out" : "") + (p.featured ? " · featured" : "") +
    '</div></div><button class="ghost" data-id="' + p.id + '">Edit</button></div></div>'
  ).join("");
}
$("list").onclick = e => {
  const btn = e.target.closest("[data-id]");
  if (!btn) return;
  open(catalog.products.find(p => p.id === btn.dataset.id));
};
$("add").onclick = () => open(null);
function open(p) {
  editing = p;
  $("editor").classList.add("on");
  $("title").textContent = p ? "Edit item" : "New item";
  $("name").value = p ? p.name : "";
  $("price").value = p ? p.price : "";
  $("visible").checked = p ? p.visible !== false : true;
  $("soldOut").checked = p ? !!p.soldOut : false;
  $("featured").checked = p ? !!p.featured : false;
  $("delivery").checked = p ? !!p.delivery : true;
  $("photo").value = "";
  photoData = p && p.image ? p.image : "";
  const prev = $("preview");
  if (photoData) { prev.src = photoData; prev.style.display = "block"; }
  else prev.style.display = "none";
  $("remove").style.display = p ? "" : "none";
  if (p) $("cat").value = p.cat;
  const editor = $("editor");
  if (p) {
    const row = document.querySelector('.block[data-id="' + p.id + '"]');
    row.after(editor);
    row.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    $("addSlot").appendChild(editor);
    editor.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
$("cancel").onclick = () => parkEditor();

async function persist(message) {
  setBusy(true);
  $("status").className = "meta";
  $("status").textContent = "Saving…";
  try {
    const result = await BCSCatalog.saveCatalog(catalog);
    source = result.source;
    updateBanner();
    $("status").textContent = message || (result.source === "cloud"
      ? "Saved online. Anyone who opens the shop will see this after refresh."
      : "Saved on this browser only.");
    draw();
  } catch (e) {
    $("status").className = "err";
    $("status").textContent = "Save failed. Check your Firebase URL and database rules.";
  } finally {
    setBusy(false);
  }
}

$("editor").onsubmit = e => {
  e.preventDefault();
  const item = {
    id: editing ? editing.id : ("item-" + Date.now().toString(36)),
    name: $("name").value.trim(),
    cat: $("cat").value,
    price: Number($("price").value),
    visible: $("visible").checked,
    soldOut: $("soldOut").checked,
    featured: $("featured").checked,
    delivery: $("delivery").checked,
    image: photoData
  };
  if (editing) catalog.products = catalog.products.map(p => p.id === item.id ? item : p);
  else catalog.products.push(item);
  persist();
};
$("photo").onchange = () => {
  const file = $("photo").files && $("photo").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 720 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      photoData = canvas.toDataURL("image/jpeg", 0.72);
      $("preview").src = photoData;
      $("preview").style.display = "block";
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};
$("clearPhoto").onclick = () => {
  photoData = "";
  $("photo").value = "";
  $("preview").style.display = "none";
};
$("remove").onclick = () => {
  if (!editing || !confirm("Delete this item?")) return;
  catalog.products = catalog.products.filter(p => p.id !== editing.id);
  persist("Deleted.");
};
</script>
</body>
</html>
